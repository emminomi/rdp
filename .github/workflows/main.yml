name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
              netsh advfirewall firewall set rule name="Remote Desktop - User Mode (TCP-In)" new enable=yes
              netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
              Write-Host "RDP settings configured successfully."
          } catch {
              Write-Error "Failed in RDP configuration: $_"
              exit 1
          }

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
              $charSet = @{
                  Upper   = [char[]](65..90)
                  Lower   = [char[]](97..122)
                  Number  = [char[]](48..57)
                  Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
              }
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
              
              $securePass = ConvertTo-SecureString $password -AsPlainText -Force
              
              if (Get-LocalUser -Name "RDPUser" -ErrorAction SilentlyContinue) {
                  Remove-LocalUser -Name "RDPUser"
              }
              
              New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
              
              echo "RDP_CREDS=User: RDPUser | Password: $password" >> $env:GITHUB_ENV
              Write-Host "RDP user created successfully."
          } catch {
              Write-Error "Failed in user creation: $_"
              exit 1
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
              Write-Host "Installing Tailscale via winget..."
              winget install Tailscale.Tailscale --accept-source-agreements --accept-package-agreements --silent
              
              # Refresh environment PATH so tailscale command is recognized
              $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
              Write-Host "Tailscale installed successfully."
          } catch {
              Write-Error "Failed to install Tailscale: $_"
              exit 1
          }

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
              $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
              & $tailscalePath up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
              
              $tsIP = $null
              $retries = 0
              while (-not $tsIP -and $retries -lt 15) {
                  $tsIP = & $tailscalePath ip -4
                  Start-Sleep -Seconds 5
                  $retries++
              }
              
              if (-not $tsIP) {
                  throw "Tailscale IP not assigned after retries."
              }
              echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
              Write-Host "Tailscale connected with IP: $tsIP"
          } catch {
              Write-Error "Failed to establish Tailscale connection: $_"
              exit 1
          }

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDPUser"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
